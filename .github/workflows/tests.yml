name: CPU protocol checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU environment
        run: bash scripts/setup.sh --cpu
      - name: Protocol checks
        run: .venv/bin/python -m pytest -q
      - name: End-to-end smoke
        run: .venv/bin/python -m pmr smoke --steps 10 --rounds 2 --out runs/ci
      - name: Three-arm ablation and saved selection audit
        run: |
          .venv/bin/python -m pmr smoke --steps 50 --ablation --out runs/ci-v3
          .venv/bin/python -m pmr audit-selection --run runs/ci-v3
          .venv/bin/python scripts/package_results.py --run runs/ci-v3
      - name: V4 state-memory training and packaging smoke
        run: |
          .venv/bin/python -m pmr.state_memory --device cpu --smoke --steps 3 --train-episodes 32 --dev-episodes 8 --eval-episodes 8 --seeds 42 --eval-lengths 24,48 --max-seconds 120 --out runs/ci-v4
          .venv/bin/python scripts/package_results.py --run runs/ci-v4
  v6:
    # V6.1 BF-Delta: numpy algebra/data tests, torch parity tests and an
    # end-to-end CPU SMOKE of every stage on synthetic Memory-Maze-format data.
    # Software checks only; SMOKE numbers are meaningless.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch 2.9.1 and V6 requirements
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-v6.txt
      - name: V6.1 unit, algebra and torch parity tests
        run: python -m unittest discover -s tests/predictive_memory_v6 -t . -v
      - name: V6.1 CPU end-to-end SMOKE and report
        run: |
          python -m pmr.predictive_memory_v6 run --stage SMOKE --out runs/ci-v6 --procs-per-gpu 2
          python -m pmr.predictive_memory_v6 report --out runs/ci-v6
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-smoke
          path: |
            runs/ci-v6/**/status.json
            runs/ci-v6/**/job.log
            runs/ci-v6/**/summary.json
            runs/ci-v6/report/**
            runs/ci-v6/SMOKE_status.json
          retention-days: 7
